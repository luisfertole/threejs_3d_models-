<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty VR Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Oculta los elementos HTML originales; se renderizarán en 3D */
        /* Usamos visibility y opacity para que html2canvas pueda leerlos */
        #vrMenu, #countdown, #gameOver, #score-display {
            visibility: hidden; /* Hace el elemento invisible */
            opacity: 0;          /* Lo hace completamente transparente */
            position: absolute; /* Mantenlo para un posicionamiento flexible */
            color: white;
            padding: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            text-align: center;
            box-sizing: border-box; /* Asegura que el padding no desborde el ancho/alto */
        }

        /* Posiciones específicas para elementos que lo requieran */
        #gameOver {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
        #vrMenu {
            flex-direction: column;
            gap: 10px;
        }
        #vrMenu button {
            padding: 10px 20px;
            font-size: 1.2em;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #countdown {
            font-size: 4em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            /* La posición en 3D será manejada por Three.js */
        }
        #score-display {
            /* Estas propiedades de posición y tamaño se aplican si el elemento está visible */
            top: 10px;
            right: 10px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="vrMenu">
        <h2>Menú VR</h2>
        <button id="pauseBtn">⏸ Pausa</button>
        <button id="restartBtn">🔄 Reiniciar</button>
        <button id="startRoundBtn">⚽ Iniciar Ronda</button>
    </div>

    <div id="countdown"></div>

    <div id="gameOver">
        <h2 id="gameResult"></h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">Reiniciar Juego</button>
    </div>

    <div id="score-display">
        Portero: <span id="goalkeeperScore">0</span> | Rival: <span id="shooterScore">0</span> | Ronda: <span id="round">1</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "../jsm/"
            }
        }
    </script>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
