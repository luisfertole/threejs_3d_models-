<!DOCTYPE html>
<html lang="es">
<head>
    <title>Penalty VR Game - Meta Quest 3</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100%;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            display: none;
            z-index: 200;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
        }
        
        #vrButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        #vrButton:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="ui">
        <div>Portero: <span id="goalkeeperScore">0</span></div>
        <div>Rival: <span id="shooterScore">0</span></div>
        <div>Ronda: <span id="round">1</span></div>
    </div>
    
    <div id="gameOver">
        <h2 id="gameResult"></h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">Jugar de Nuevo</button>
    </div>
    
    <button id="vrButton">Iniciar VR</button>
    
    <div id="instructions">
        <strong>Controles Meta Quest 3:</strong><br>
        • Botón B (derecho): Iniciar penal<br>
        • Botón Y (izquierdo): Pausa<br>
        • Botón X (izquierdo): Reiniciar<br>
        • Usa las manos para detener el balón<br>
        • ¡Detén 7 penales para ganar!
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "../jsm/"
            }
        }
    </script>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
